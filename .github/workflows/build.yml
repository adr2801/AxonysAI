name: Build Android APK & Desktop

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # On donne la permission au script de créer une Release sur GitHub
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Android debug keystore
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: debug-keystore-${{ runner.os }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Get SHA-1 Fingerprint
      run: gradle signingReport
      working-directory: ./AxonysAndroidApp

    - name: Build Android APK
      run: gradle assembleDebug
      working-directory: ./AxonysAndroidApp

    # --- AJOUT : Étape de build pour la version Desktop ---
    - name: Build Desktop App (.deb)
      run: gradle :desktop:packageMsi
      working-directory: ./AxonysAndroidApp

    # --- MODIFICATION : Publication combinée des deux applications ---
    - name: Publier sur la page Releases (Pas de quota)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.3.5"
        name: "Axonys AI (Android & Desktop)"
        body: "Téléchargez l'application Axonys AI pour Android (APK) ou pour votre ordinateur (Linux .deb) directement depuis cette page !"
        files: |
          AxonysAndroidApp/app/build/outputs/apk/debug/AxonysAI.apk
          AxonysAndroidApp/desktop/build/compose/binaries/main/deb/*.deb
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
