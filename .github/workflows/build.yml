name: Build Android APK & Desktop

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── JOB 1 : Android APK + Desktop Linux .deb ───
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Android debug keystore
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: debug-keystore-${{ runner.os }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build Android APK
      run: gradle assembleDebug
      working-directory: ./AxonysAndroidApp

    - name: Build Desktop .deb (Linux)
      run: gradle :desktop:packageDeb
      working-directory: ./AxonysAndroidApp

    # Upload APK et .deb pour le job release
    - uses: actions/upload-artifact@v4
      with:
        name: build-linux-artifacts
        path: |
          AxonysAndroidApp/app/build/outputs/apk/debug/*.apk
          AxonysAndroidApp/desktop/build/compose/binaries/main/deb/*.deb

  # ─── JOB 2 : Desktop MSI (sur Windows) ───
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build Desktop .msi (Windows Installer)
      run: gradle :desktop:packageMsi
      working-directory: ./AxonysAndroidApp

    # Upload .msi pour le job release
    - uses: actions/upload-artifact@v4
      with:
        name: build-windows-artifacts
        path: AxonysAndroidApp/desktop/build/compose/binaries/main/msi/*.msi

  # ─── JOB 3 : Release (combine tout et publie) ───
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: build-linux-artifacts
        path: ./artifacts/linux

    - uses: actions/download-artifact@v4
      with:
        name: build-windows-artifacts
        path: ./artifacts/windows

    - name: Publier sur la page Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.3.5"
        name: "Axonys AI (Android & Desktop)"
        body: |
          📱 **Android** : APK
          🐧 **Linux** : .deb
          🪟 **Windows** : .msi (assistant d'installation)
        files: |
          ./artifacts/linux/**/*
          ./artifacts/windows/**/*
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}