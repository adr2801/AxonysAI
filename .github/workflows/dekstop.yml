name: Build Jarvis Desktop

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-desktop:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configuration de Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Accorder les permissions d'exécution à Gradle
      run: chmod +x gradlew

    - name: Compiler le package Desktop
      run: ./gradlew :desktop:packageDistributionForCurrentOS

    - name: Publier sur la page Releases (Pas de quota)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.3.5"
        name: "Axonys AI (Android & Desktop)"
        body: "Téléchargez l'application Axonys AI pour Android (APK) et pour PC (Linux .deb) directement depuis cette page !"
        files: |
          desktop/build/compose/binaries/main/deb/*.deb
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
