name: Build Flet APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet and Dependencies
        run: |
          pip install flet numpy

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Build APK avec génération de clé
        run: |
          # 1. Créer le dossier pour l'icône
          mkdir -p assets
          cp icon.png assets/icon.png
          
          # 2. Générer une clé de signature sur le serveur
          keytool -genkey -noprompt \
            -alias ma-cle-cortex \
            -dname "CN=CortexAI, O=Cortex, C=FR" \
            -keystore mon-projet.keystore \
            -storepass "mon_password_123" \
            -keypass "mon_password_123" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          # 3. Lancer le build Flet
          yes | flet build apk \
            --project "Cortex AI" \
            --build-number 2 \
            --keystore-path "mon-projet.keystore" \
            --keystore-password "mon_password_123" \
            --keystore-alias "ma-cle-cortex" \
            --key-password "mon_password_123"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cortex-ai-app
          path: build/apk/*.apk
          
