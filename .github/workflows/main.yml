name: Build Flet APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet and Dependencies
        run: |
          pip install flet numpy

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Generer Keystore temporaire
        run: |
          keytool -genkey -noprompt \
            -alias ma-cle-cortex \
            -dname "CN=CortexAI, OU=Dev, O=Cortex, L=Paris, S=France, C=FR" \
            -keystore mon-projet.keystore \
            -storepass mon_mot_de_passe_secret \
            -keypass mon_mot_de_passe_secret \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build APK
        run: |
          # On s'assure que le dossier assets et l'icône sont là
          mkdir -p assets
          cp icon.png assets/icon.png
          
          # La commande de build avec les bons paramètres
          yes | flet build apk \
            --project "Cortex AI" \
            --build-number 2 \
            --keystore-path "mon-projet.keystore" \
            --keystore-password "ton_mot_de_passe" \
            --keystore-alias "ma-cle-cortex" \
            --key-password "ton_mot_de_passe"

      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cortex-ai-app
          path: build/apk/*.apk
          
