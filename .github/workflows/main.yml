name: Build Update with Existing Keystore
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install flet numpy requests

      - name: Prepare Assets
        run: |
          mkdir -p assets
          if [ -f "icon.png" ]; then cp icon.png assets/icon.png; fi

      - name: Build Optimized APK (MAJ)
        run: |
          # On utilise --build-number 2 pour la mise à jour
          # On cible arm64-v8a pour réduire le poids de NumPy
          yes | flet build apk --project "Cortex AI" \
            --build-number 2 \
            --target-arch arm64-v8a
        env:
          # Ici, remplace par le NOM EXACT de ton fichier qui est sur ton GitHub
          FLET_ANDROID_KEYSTORE_PATH: "ton-fichier.keystore" 
          # Remplace par tes VRAIS mots de passe
          FLET_ANDROID_KEYSTORE_PASSWORD: "TON_MOT_DE_PASSE"
          FLET_ANDROID_KEY_ALIAS: "TON_ALIAS"
          FLET_ANDROID_KEY_PASSWORD: "TON_MOT_DE_PASSE_CLE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cortex-ai-update
          path: build/apk/*.apk
