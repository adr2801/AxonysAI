name: Build Flet APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet and Dependencies
        run: |
          pip install flet numpy

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Build APK
        run: |
          # 1. Préparation des assets pour l'icône
          mkdir -p assets
          cp icon.png assets/icon.png
          
          # 2. Génération de la clé sur le serveur
          keytool -genkey -noprompt \
            -alias ma-cle-cortex \
            -dname "CN=CortexAI, O=Cortex, C=FR" \
            -keystore mon-projet.keystore \
            -storepass "J150924" \
            -keypass "J150924" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          # 3. Build avec les variables d'environnement (méthode correcte)
          yes | flet build apk --project "Cortex AI" --build-number 2
        env:
          FLET_ANDROID_KEYSTORE_PATH: "mon-projet.keystore"
          FLET_ANDROID_KEYSTORE_PASSWORD: "J150924"
          FLET_ANDROID_KEY_ALIAS: "ma-cle-cortex"
          FLET_ANDROID_KEY_PASSWORD: "J150924"
      
      - name: Upload APK and Keystore
        uses: actions/upload-artifact@v4
        with:
          name: cortex-ai-package
          path: |
            build/apk/*.apk
            mon-projet.keystore
