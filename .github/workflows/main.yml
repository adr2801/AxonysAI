name: Build Update with Existing Keystore
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install flet numpy requests

      - name: Prepare Assets
        run: |
          mkdir -p assets
          if [ -f "icon.png" ]; then cp icon.png assets/icon.png; fi

      - name: Build Optimized APK (MAJ)
        run: |
          # La commande reste très simple pour éviter les erreurs d'arguments
          yes | flet build apk --project "Cortex AI"
        env:
          # --- CONFIGURATION DE LA MAJ ---
          FLET_ANDROID_BUILD_NUMBER: "2"
          FLET_ANDROID_BUILD_VERSION: "1.1.0"
          
          # --- OPTIMISATION DE TAILLE ---
          FLET_ANDROID_TARGET_ARCH: "arm64-v8a"
          
          # --- TON KEYSTORE EXISTANT ---
          # Assure-toi que ce fichier est bien à la racine de ton GitHub
          FLET_ANDROID_KEYSTORE_PATH: "mon-projet.keystore" 
          FLET_ANDROID_KEYSTORE_PASSWORD: "J150924"
          FLET_ANDROID_KEY_ALIAS: "ma-cle-cortex"
          FLET_ANDROID_KEY_PASSWORD: "J150924"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cortex-ai-update
          path: build/apk/*.apk
